<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 264" role="img" aria-labelledby="title desc">
  <title id="title">NAR research illustration</title>
  <desc id="desc">A conceptual routing diagram connecting observations, a policy, and expert pathways. This is an illustration, not experimental data.</desc>
  <style>
    svg { --bg: #f6f8f7; --wire: #dce5df; --path: #35835b; --input: #fff; --border: #8da496; --mark: #648070; --halo: #e9f1eb; --policy: #28714d; --expert: #e7f1e9; --expert-border: #7aa18b; --inactive: #cad6cf; --dot: #62816e; --label: #526b5c; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #262a2c; --wire: #3c4b43; --path: #86bd9a; --input: #2e3a32; --border: #728e7d; --mark: #b8d1c0; --halo: #2b3a31; --policy: #447d5c; --expert: #314639; --expert-border: #7a9c87; --inactive: #52675b; --dot: #aac1b3; --label: #aac1b3; }
    }
  </style>
  <rect width="352" height="264" fill="var(--bg)"/>
  <g fill="none" stroke="var(--wire)" stroke-width="1.5"><path d="M55 126h70M159 126c40 0 35-62 86-62M159 126h86M159 126c40 0 35 62 86 62M245 64c37 0 35 62 63 62M245 126h63M245 188c37 0 35-62 63-62"/><circle cx="156" cy="126" r="91" stroke-dasharray="3 6"/></g>
  <g fill="none" stroke="var(--path)" stroke-width="2.5"><path d="M55 126h70M159 126c40 0 35-62 86-62M245 64c37 0 35 62 63 62M159 126c40 0 35 62 86 62M245 188c37 0 35-62 63-62"/></g>
  <rect x="39" y="110" width="32" height="32" rx="8" fill="var(--input)" stroke="var(--border)" stroke-width="1.5"/>
  <path d="m46 131 6-8 5 5 5-5m-16-7h18v20H46z" fill="none" stroke="var(--mark)" stroke-width="1.4"/>
  <circle cx="143" cy="126" r="36" fill="var(--halo)"/>
  <rect x="121" y="104" width="44" height="44" rx="12" fill="var(--policy)"/>
  <text x="143" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#ffffff">π</text>
  <g fill="var(--expert)" stroke="var(--expert-border)" stroke-width="1.5"><rect x="231" y="50" width="28" height="28" rx="8"/><rect x="231" y="174" width="28" height="28" rx="8"/></g>
  <rect x="231" y="112" width="28" height="28" rx="8" fill="var(--bg)" stroke="var(--inactive)" stroke-width="1.5"/>
  <g fill="var(--dot)"><circle cx="245" cy="64" r="3"/><circle cx="245" cy="188" r="3"/></g>
  <circle cx="308" cy="126" r="11" fill="var(--policy)"/>
  <path d="M303 126h10m-4-4 4 4-4 4" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text x="176" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2.2" fill="var(--label)">OBSERVE · ROUTE · ACT</text>
